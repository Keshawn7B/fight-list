name: Update fight schedule

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fight-schedule-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read official schedules
        run: npm run sync:events

      - name: Validate the updated app
        run: |
          npm run lint
          npm run build:pages

      - name: Publish schedule changes
        run: |
          if git diff --quiet -- app/generated-events.json; then
            echo "No schedule changes found."
            exit 0
          fi
          git config user.name "fight-list-updater[bot]"
          git config user.email "fight-list-updater[bot]@users.noreply.github.com"
          git add app/generated-events.json
          git commit -m "Update official fight schedule"
          git push origin HEAD:main
